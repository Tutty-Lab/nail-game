name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload signed IPA to TestFlight (no App Store submission)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nailplay-testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Test and build web assets
        run: |
          npm ci
          npm test
          npm run build:web
          npx cap sync ios
      - name: Check toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ ${sdk_version%%.*} -ge 26 ]] || { echo 'App Store requires iOS SDK 26+'; exit 1; }
      - name: Install isolated signing identity
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages 'pyjwt[crypto]==2.10.1'
          python3 scripts/ios_ci_signing.py install
      - name: Archive
        run: |
          build_number=$((100 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NailPlay.xcarchive" \
            CURRENT_PROJECT_VERSION="$build_number"
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NailPlay.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/nailplay-signing/ExportOptions.plist" \
            -exportPath build/ipa
      - name: Keep signed IPA briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nailplay-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/nailplay-signing/private_keys
        run: |
          shopt -s nullglob
          files=(build/ipa/*.ipa)
          [[ ${#files[@]} == 1 ]] || { echo 'Expected exactly one IPA'; exit 1; }
          xcrun altool --upload-app --type ios --file "${files[0]}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing secrets
        if: always()
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 scripts/ios_ci_signing.py cleanup
